spring:
  application:
    name: web-application

  datasource:
    platform: postgres
    url: jdbc:postgresql://localhost:5432/vollmed_web
    username: postgres
    password: teste123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: true

  mvc:
    hiddenmethod:
      filter:
        enabled: true